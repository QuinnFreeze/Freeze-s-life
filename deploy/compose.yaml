name: freeze-nest
services:
  nest:
    image: freeze-nest:${NEST_RELEASE:?Set NEST_RELEASE}
    restart: unless-stopped
    environment:
      NEST_DATA_DIR: /data
      NEST_ORIGIN: https://xiaoqiuyi.me
      NEST_COOKIE_SECURE: "1"
      NEST_TRUST_PROXY: "1"
    volumes:
      - /opt/freeze-nest/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    networks:
      nest_net:
        aliases:
          - freeze-nest
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
networks:
  nest_net:
    external: true
    name: nest_net

