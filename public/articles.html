  <link rel="stylesheet" href="/cms.css">
  <script src="/app.js" defer></script>

<body data-page="articles">

  <div class="wallpaper" aria-hidden="true"><img src="/assets/paper-background.jpeg" alt="" fetchpriority="high"></div>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="/index.html" data-page-link><img class="brand-icon" src="/assets/favicon.svg" alt=""><span class="brand-copy"><span class="brand-name">Freeze’s Nest</span><span class="brand-subtitle" data-i18n="nestSubtitle">秋易的小窝</span></span></a>
      <button class="language-toggle" id="language-toggle" type="button" aria-label="切换到英文" hidden>EN</button>
      <nav class="nav-pill" aria-label="页面导航" data-i18n-aria="navigation">
        <a class="nav-link" href="/index.html" data-page-link="home" data-i18n="navHome">首页</a>
        <a class="nav-link" href="/about.html" data-page-link="about" data-i18n="navAbout">关于</a>
        <a class="nav-link" href="/projects.html" data-page-link="projects" data-i18n="navProjects">项目</a>

        <a class="nav-link" href="/contact.html" data-page-link="contact" data-i18n="navContact">联系</a>
      </nav>
    </header>
    <main id="content" class="page-layout cms-layout" tabindex="-1">
      <header class="nest-intro page-intro"><h1 class="page-title" data-cms="articles">文章</h1><p class="nest-description" data-cms="lead">阅读、思考与实践的记录。</p></header>
      <form id="article-search" class="card-base cms-toolbar" role="search">
        <label class="cms-field cms-search-field"><span data-cms="search">搜索文章</span><input id="article-query" class="cms-input" name="q" type="search" maxlength="200" autocomplete="off"></label>
        <label class="cms-field"><span data-cms="category">分类</span><select id="article-category" class="cms-input" name="category"><option value="" data-cms="allCategories">全部分类</option></select></label>
        <label class="cms-field"><span data-cms="tag">标签</span><input id="article-tag" class="cms-input" name="tag" maxlength="40" autocomplete="off"></label>
        <button class="cms-button" type="submit" data-cms="searchButton">搜索</button>
      </form>
      <div class="cms-results-bar"><p id="article-result-count" aria-live="polite"></p><button class="cms-link" id="article-reset" type="button" hidden data-cms="clearFilters">清除筛选</button></div>
      <section id="article-results" class="cms-grid" aria-live="polite" aria-busy="true" aria-label="文章列表"><div class="card-base cms-status" data-cms="loading">正在加载文章…</div></section>
      <nav id="article-pagination" class="cms-pagination" aria-label="文章分页" hidden></nav>
      <noscript><p class="card-base cms-status">请启用 JavaScript 浏览动态文章。 / Enable JavaScript to browse articles.</p></noscript>
